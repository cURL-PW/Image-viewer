<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Viewer に取り込む - 設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Image Viewer に取り込む</h1>
      <p class="hint">
        Image Viewer の設定で「ブラウザからの取り込みを受け付ける」をオンにし、
        表示されたポート番号と合言葉をここに貼り付けてください。
      </p>

      <section id="permission" class="warning" hidden>
        <p>すべてのサイトへのアクセスが許可されていないため、画像を取り込めません。</p>
        <button type="button" id="grant">アクセスを許可する</button>
      </section>

      <form id="form">
        <label>
          <span>ポート</span>
          <input id="port" type="number" min="1024" max="65535" required />
        </label>
        <label>
          <span>合言葉</span>
          <input id="token" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <label>
          <span>クリックで取り込む</span>
          <select id="modifier"></select>
        </label>
        <p class="hint">
          設定したキーを押しながら画像をクリックすると取り込みます。
          画像の右クリックメニュー「Image Viewer に取り込む」でも取り込めます。
        </p>
        <div class="actions">
          <button type="submit">保存</button>
          <button type="button" id="test">接続を確かめる</button>
          <span id="message" role="status"></span>
        </div>
      </form>
    </main>
    <script src="lib.js"></script>
    <script src="options.js"></script>
  </body>
</html>
